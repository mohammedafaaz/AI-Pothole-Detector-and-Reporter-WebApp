services:
  # Backend API Service
  - type: web
    name: pothole-detector-api
    env: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && gunicorn app:app
    runtime: python3.9
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: ADMIN_EMAIL
        sync: false

  # Frontend (React / Vite build)
  - type: web
    name: pothole-detector-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pothole-detector-api.onrender.com
